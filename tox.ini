[tox]
envlist =
    {py311,py312,py313,py314}-django52,
    {py312,py313,py314}-django60,
    {py312,py313,py314,py315}-django61,
    lint

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    django52: django>=5.2,<6.0
    django60: django>=6.0,<6.1
    django61: django>=6.1,<6.2
extras = test
commands = coverage run --source django_pwned_passwords -m pytest {posargs}

[testenv:lint]
skip_install = true
commands =
    black django_pwned_passwords --check
    isort django_pwned_passwords --check --diff
    ruff check django_pwned_passwords
deps =
    black
    isort
    ruff
