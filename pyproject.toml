[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=77",
]

[project]
name = "django-pwned-passwords-ng"
description = "A Django password validator that checks Troy Hunt's PWNED Passwords API to see if a password has been involved in a major security breach before."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jamie Counsell" },
    { name = "Sean Meyer" },
]
maintainers = [{ name = "Sean Meyer" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = [
    "version",
]
dependencies = [
    "django>=5.2",
    "requests",
]

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
    "pytest-django",
    "requests-mock",
]
dev = [
    "django-pwned-passwords-ng[test]",
    "build",
    "bump-my-version",
    "tox",
    "twine",
]

[project.urls]
"CI" = "https://github.com/slinkymanbyday/django-pwned-passwords/actions"
"Changelog" = "https://github.com/slinkymanbyday/django-pwned-passwords/releases"
"Homepage" = "https://github.com/slinkymanbyday/django-pwned-passwords"
"Issues" = "https://github.com/slinkymanbyday/django-pwned-passwords/issues"

[tool.setuptools.dynamic]
version = { attr = "django_pwned_passwords.__version__" }

[tool.isort]
profile = "black"

[tool.ruff]
extend-exclude = [
    "__pycache__",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E", "W",
    # flake8
    "F",
    # isort
    "I",
    # pytest style
    "PT",
    # eradicate commented code
    "ERA",
    # ruff lint
    "RUF",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
django_find_project = false
pythonpath = ["."]

[tool.bumpversion]
current_version = "6.0.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "django_pwned_passwords/__init__.py"
